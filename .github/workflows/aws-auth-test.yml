name: AWS Authentication Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  test-aws-auth:
    name: Test ${{ matrix.environment }} AWS authentication
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - environment: dev
            account_id: "368287211388"

          - environment: stage
            account_id: "397348547249"

          - environment: prod
            account_id: "527055790448"

    environment: ${{ matrix.environment }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsTerraform-${{ matrix.environment }}
          allowed-account-ids: ${{ matrix.account_id }}

      - name: Verify AWS identity
        run: |
          echo "Environment: ${{ matrix.environment }}"
          echo "Expected account: ${{ matrix.account_id }}"
          aws sts get-caller-identity